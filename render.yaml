services:
  - type: web
    name: jenga-construction-estimator
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: jenga-estimator-db
          property: connectionString

databases:
  - name: jenga-estimator-db
    databaseName: jengaestimate
    user: jengaestimate
    plan: basic-256mb
    region: singapore
