services:
  - type: web
    name: jenga-construction-estimator
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jenga-estimator-db
          property: connectionString
      - key: ESTIMATE_SERVICE_URL
        value: http://jenga-estimator-calculator:10000

  - type: pserv
    name: jenga-estimator-calculator
    runtime: python
    rootDir: calculator
    buildCommand: python -m py_compile calculator.py
    startCommand: python calculator.py
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"

databases:
  - name: jenga-estimator-db
    databaseName: construction
    user: jengaestimate
    plan: basic-256mb
    region: singapore
